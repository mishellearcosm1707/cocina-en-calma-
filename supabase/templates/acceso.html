<div style="font-family: Arial, Helvetica, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #23291F;">
  <h2 style="margin: 0 0 12px; font-size: 22px;">Tu enlace para entrar a Cocina en Calma</h2>
  <p style="font-size: 16px; line-height: 1.5;">Toca el botón para abrir tu Menú Calma. El enlace funciona una sola vez.</p>
  <p style="margin: 24px 0;">
    <a href="{{ .SiteURL }}/auth/confirmar?token_hash={{ .TokenHash }}&type=email"
       style="background: #4F6F2B; color: #FDFBF6; padding: 14px 24px; border-radius: 12px; text-decoration: none; font-weight: bold; font-size: 16px; display: inline-block;">
      Entrar a mi app
    </a>
  </p>
  <p style="font-size: 14px; color: #6B6F62; line-height: 1.5;">Si no pediste este correo, puedes ignorarlo: nadie entra a tu cuenta sin este enlace.</p>
</div>
